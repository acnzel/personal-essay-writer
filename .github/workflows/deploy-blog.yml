name: Deploy Blog

on:
  push:
    paths:
      - '.claude/skills/personal-essay/data/essays/**/*.md'
    branches:
      - main
  workflow_dispatch:

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest

    # The secrets context is not available in a step's `if`, so the hook is
    # surfaced as an env var that the condition can read.
    env:
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install blog-sync dependencies
        run: npm install
        working-directory: scripts/blog-sync

      - name: Copy essays to blog/content
        run: node copy-essays.js
        working-directory: scripts/blog-sync

      - name: Sync to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node sync-supabase.js
        working-directory: scripts/blog-sync

      - name: Trigger Vercel Deploy
        if: env.VERCEL_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
